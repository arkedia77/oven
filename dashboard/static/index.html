<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liszt Engine Lab</title>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-synthesizer@1.8.5/externals/libfluidsynth-2.3.0-with-libsndfile.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-synthesizer@1.8.5/dist/js-synthesizer.min.js"></script>
<style>
:root {
  --bg: #09090b; --card: #111114; --card2: #18181b;
  --border: #27272a; --accent: #6366f1; --accent2: #8b5cf6;
  --green: #22c55e; --yellow: #eab308; --red: #ef4444; --blue: #3b82f6;
  --text: #fafafa; --muted: #71717a; --dim: #3f3f46;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,system-ui,sans-serif; }

/* Header */
.header { padding:2rem 2.5rem; border-bottom:1px solid var(--border); }
.header h1 { font-size:1.6rem; font-weight:800; letter-spacing:-0.03em; }
.header h1 span { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.header p { color:var(--muted); font-size:0.85rem; margin-top:0.3rem; }

/* SF2 Status */
.sf2-status { padding:0.5rem 2.5rem; background:var(--card); border-bottom:1px solid var(--border); font-size:0.8rem; display:flex; align-items:center; gap:0.5rem; }
.sf2-dot { width:8px; height:8px; border-radius:50%; }
.sf2-dot.loading { background:var(--yellow); animation:pulse 1s infinite; }
.sf2-dot.ready { background:var(--green); }
.sf2-dot.error { background:var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Version Tabs */
.tabs { display:flex; padding:0 2.5rem; border-bottom:1px solid var(--border); overflow-x:auto; }
.tab { background:none; border:none; color:var(--muted); padding:0.9rem 1.5rem; font-size:0.9rem; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }

/* Main */
main { padding:2rem 2.5rem; max-width:1400px; margin:0 auto; }

/* Version Section */
.version-section { margin-bottom:3rem; }
.version-header { display:flex; gap:2rem; margin-bottom:1.5rem; flex-wrap:wrap; }
.version-info { flex:1; min-width:300px; }
.version-info h2 { font-size:1.3rem; font-weight:700; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.75rem; }
.version-badge { font-size:0.7rem; padding:0.2rem 0.6rem; border-radius:999px; font-weight:600; }
.version-badge.success { background:rgba(34,197,94,0.15); color:var(--green); }
.version-badge.partial { background:rgba(234,179,8,0.15); color:var(--yellow); }
.version-badge.fail { background:rgba(239,68,68,0.15); color:var(--red); }

.training-details { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1rem 1.25rem; font-size:0.82rem; line-height:1.7; }
.training-details .label { color:var(--muted); display:inline-block; min-width:100px; }
.training-details .highlight { color:var(--accent); font-weight:600; }
.training-details .warn { color:var(--yellow); }
.training-details .good { color:var(--green); }

.version-stats { display:flex; gap:1rem; flex-wrap:wrap; }
.stat-box { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:0.75rem 1rem; min-width:120px; text-align:center; }
.stat-box .num { font-size:1.5rem; font-weight:800; }
.stat-box .lbl { font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:0.1rem; }

/* Sample Grid */
.sample-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:1rem; }

.sample-card { background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; transition:all 0.2s; }
.sample-card:hover { border-color:var(--dim); }
.sample-card.playing { border-color:var(--green); box-shadow:0 0 24px rgba(34,197,94,0.1); }

.sample-top { padding:0.75rem 1rem; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
.sample-top h4 { font-size:0.85rem; font-weight:600; }
.sample-tags { display:flex; gap:0.3rem; }
.tag { font-size:0.6rem; padding:0.1rem 0.4rem; border-radius:3px; background:rgba(99,102,241,0.12); color:var(--accent); }

.sample-metrics { display:grid; grid-template-columns:repeat(4,1fr); }
.sm { padding:0.5rem 0.6rem; border-right:1px solid var(--border); border-bottom:1px solid var(--border); }
.sm:nth-child(4n) { border-right:none; }
.sm .sl { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
.sm .sv { font-size:0.95rem; font-weight:700; margin-top:0.1rem; }
.sv.good { color:var(--green); } .sv.warn { color:var(--yellow); } .sv.bad { color:var(--red); }

.piano-roll { height:64px; background:#07070a; position:relative; }
.piano-roll canvas { width:100%; height:100%; }

.player-bar { padding:0.6rem 1rem; display:flex; align-items:center; gap:0.6rem; }
.pbtn { width:32px; height:32px; border-radius:50%; border:2px solid var(--accent); background:none; color:var(--accent); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.15s; }
.pbtn:hover { background:var(--accent); color:white; }
.pbtn.on { background:var(--green); border-color:var(--green); color:white; }
.pbtn svg { width:12px; height:12px; }
.pbar { flex:1; height:4px; background:rgba(255,255,255,0.08); border-radius:2px; cursor:pointer; position:relative; }
.pfill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:2px; width:0; }
.ptime { font-size:0.7rem; color:var(--muted); min-width:60px; text-align:right; }

/* Test suite sub-section */
.sub-section { margin-top:1.5rem; }
.sub-title { font-size:0.95rem; font-weight:600; color:var(--muted); margin-bottom:0.75rem; padding-left:0.25rem; border-left:3px solid var(--accent); padding-left:0.75rem; }

/* Architecture section */
.arch-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1.25rem; margin-bottom:2rem; }
.arch-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1.25rem; }
.arch-card h3 { font-size:1rem; font-weight:700; margin-bottom:0.75rem; display:flex; align-items:center; gap:0.5rem; }
.arch-card h3 .icon { font-size:1.2rem; }
.token-list { list-style:none; padding:0; }
.token-list li { padding:0.35rem 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:0.82rem; display:flex; justify-content:space-between; }
.token-list li:last-child { border:none; }
.token-list .tok-name { color:var(--accent); font-family:monospace; font-weight:600; }
.token-list .tok-count { color:var(--muted); font-size:0.75rem; }
.arch-flow { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; margin:0.5rem 0; }
.arch-block { background:var(--card2); border:1px solid var(--border); border-radius:6px; padding:0.5rem 0.8rem; font-size:0.8rem; text-align:center; }
.arch-block.fixed { border-color:var(--blue); color:var(--blue); }
.arch-block.trainable { border-color:var(--green); color:var(--green); }
.arch-block.search { border-color:var(--yellow); color:var(--yellow); }
.arch-block.cond { border-color:var(--accent); color:var(--accent); }
.arch-arrow { color:var(--dim); font-size:1.2rem; }
.arch-desc { font-size:0.8rem; color:var(--muted); line-height:1.6; margin-top:0.75rem; }
.arch-desc strong { color:var(--text); font-weight:600; }
.arch-stat { display:inline-block; background:rgba(99,102,241,0.1); color:var(--accent); padding:0.15rem 0.5rem; border-radius:4px; font-size:0.75rem; margin:0.15rem 0.2rem; font-family:monospace; }
.phase-tag { display:inline-block; padding:0.15rem 0.5rem; border-radius:4px; font-size:0.7rem; font-weight:600; margin-left:0.5rem; }
.phase-tag.current { background:rgba(34,197,94,0.15); color:var(--green); }
.phase-tag.next { background:rgba(234,179,8,0.15); color:var(--yellow); }
.phase-tag.planned { background:rgba(99,102,241,0.1); color:var(--accent); }

/* Embedding section */
.emb-summary { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:0.75rem; margin-bottom:1.5rem; }
.emb-stat { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:0.75rem 1rem; text-align:center; }
.emb-stat .ev { font-size:1.6rem; font-weight:800; }
.emb-stat .el { font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:0.15rem; }

.tsne-wrap { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1.25rem; margin-bottom:1.5rem; position:relative; }
.tsne-wrap h3 { font-size:1rem; font-weight:700; margin-bottom:0.75rem; }
.tsne-canvas { width:100%; height:500px; background:#07070a; border-radius:8px; cursor:crosshair; position:relative; }
.tsne-canvas canvas { width:100%; height:100%; }
.tsne-tooltip { position:absolute; background:var(--card2); border:1px solid var(--border); border-radius:6px; padding:0.5rem 0.7rem; font-size:0.75rem; pointer-events:none; display:none; z-index:10; max-width:250px; line-height:1.5; }
.tsne-legend { display:flex; gap:1rem; flex-wrap:wrap; margin-top:0.75rem; }
.tsne-legend-item { display:flex; align-items:center; gap:0.3rem; font-size:0.75rem; color:var(--muted); }
.tsne-legend-dot { width:10px; height:10px; border-radius:50%; }

.sim-section { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1.25rem; margin-bottom:1.5rem; }
.sim-section h3 { font-size:1rem; font-weight:700; margin-bottom:0.75rem; }
.sim-pair { display:flex; align-items:center; gap:0.75rem; padding:0.6rem 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:0.82rem; }
.sim-pair:last-child { border:none; }
.sim-score { background:rgba(34,197,94,0.15); color:var(--green); padding:0.2rem 0.5rem; border-radius:4px; font-weight:700; font-family:monospace; font-size:0.8rem; min-width:60px; text-align:center; }
.sim-files { color:var(--muted); }
.sim-files strong { color:var(--text); }

.file-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
.file-table th { text-align:left; padding:0.5rem 0.6rem; border-bottom:2px solid var(--border); color:var(--muted); text-transform:uppercase; font-size:0.65rem; letter-spacing:0.05em; }
.file-table td { padding:0.45rem 0.6rem; border-bottom:1px solid rgba(255,255,255,0.04); }
.file-table tr:hover { background:rgba(99,102,241,0.05); }
.file-table .fname { color:var(--accent); font-family:monospace; font-weight:600; }

.dist-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem; margin-bottom:1.5rem; }
.dist-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1rem; }
.dist-card h4 { font-size:0.85rem; font-weight:600; margin-bottom:0.5rem; color:var(--muted); }
.dist-bar-wrap { display:flex; align-items:center; gap:0.4rem; margin:0.2rem 0; }
.dist-label { font-size:0.7rem; color:var(--muted); min-width:50px; text-align:right; }
.dist-bar { height:14px; border-radius:3px; min-width:2px; }
.dist-val { font-size:0.7rem; color:var(--muted); min-width:30px; }

.analysis-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1.25rem; margin-bottom:1.5rem; }
.analysis-card h3 { font-size:1rem; font-weight:700; margin-bottom:0.75rem; }
.analysis-text { font-size:0.82rem; color:var(--muted); line-height:1.7; }
.analysis-text strong { color:var(--text); }
.analysis-text .insight { color:var(--accent); font-weight:600; }

/* Clustering section */
.cluster-section-title { font-size:1.1rem; font-weight:700; margin:2rem 0 1rem; padding-bottom:0.5rem; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:0.5rem; }
.cluster-section-title .csub { font-size:0.75rem; color:var(--muted); font-weight:400; }

.k-chart-wrap { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1.25rem; margin-bottom:1.5rem; }
.k-chart-wrap h3 { font-size:1rem; font-weight:700; margin-bottom:0.75rem; }
.k-chart-canvas { width:100%; height:220px; background:#07070a; border-radius:8px; }
.k-chart-canvas canvas { width:100%; height:100%; }

.cluster-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:0.75rem; margin-bottom:1.5rem; }
.cluster-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1rem; transition:border-color 0.2s; }
.cluster-card:hover { border-color:var(--dim); }
.cluster-card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.6rem; }
.cluster-card-head h4 { font-size:0.85rem; font-weight:700; }
.cluster-card-head .cl-size { font-size:0.75rem; color:var(--muted); }
.cluster-tags { display:flex; gap:0.3rem; flex-wrap:wrap; margin-bottom:0.5rem; }
.cl-tag { font-size:0.6rem; padding:0.15rem 0.45rem; border-radius:3px; font-weight:600; }
.cl-tag.reg-alto { background:rgba(99,102,241,0.15); color:var(--accent); }
.cl-tag.reg-tenor { background:rgba(234,179,8,0.15); color:var(--yellow); }
.cl-tag.dyn-p { background:rgba(59,130,246,0.15); color:var(--blue); }
.cl-tag.dyn-mp { background:rgba(34,197,94,0.15); color:var(--green); }
.cl-tag.dyn-mf { background:rgba(234,179,8,0.15); color:var(--yellow); }
.cl-tag.dyn-f { background:rgba(239,68,68,0.15); color:var(--red); }
.cl-tag.tex { background:rgba(139,92,246,0.12); color:var(--accent2); }
.cl-tag.span-tag { background:rgba(255,255,255,0.06); color:var(--muted); }
.cluster-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:0.3rem; margin-bottom:0.5rem; }
.cl-st { text-align:center; }
.cl-st .cl-sv { font-size:0.9rem; font-weight:700; }
.cl-st .cl-sl { font-size:0.55rem; color:var(--muted); text-transform:uppercase; }
.cluster-sources { font-size:0.7rem; color:var(--muted); line-height:1.5; }
.cluster-sources strong { color:var(--text); font-weight:500; }

.style-dist-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1rem; margin-bottom:1.5rem; }
.style-dist-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1rem; }
.style-dist-card h4 { font-size:0.85rem; font-weight:600; margin-bottom:0.6rem; color:var(--muted); }
.hbar-wrap { display:flex; align-items:center; gap:0.5rem; margin:0.3rem 0; }
.hbar-label { font-size:0.75rem; min-width:80px; text-align:right; color:var(--text); }
.hbar { height:16px; border-radius:3px; min-width:2px; transition:width 0.3s; }
.hbar-val { font-size:0.7rem; color:var(--muted); min-width:30px; }

/* Evaluation section */
.eval-section { margin-top:1rem; padding:1rem; background:var(--card2); border-radius:8px; border:1px solid var(--border); }
.eval-summary { font-size:0.9rem; color:var(--text); margin-bottom:0.75rem; line-height:1.5; font-weight:500; }
.eval-cols { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:0.75rem; }
.eval-col ul { margin:0; padding-left:1.2rem; font-size:0.8rem; color:var(--muted); line-height:1.6; }
.eval-col li { margin-bottom:0.2rem; }
.eval-col-title { font-size:0.8rem; font-weight:700; margin-bottom:0.4rem; text-transform:uppercase; letter-spacing:0.05em; }
.good-text { color:var(--green); }
.warn-text { color:var(--yellow); }
.eval-verdict { font-size:0.85rem; color:var(--text); line-height:1.5; padding-top:0.5rem; border-top:1px solid var(--border); }
.eval-lesson { font-size:0.8rem; color:var(--accent); margin-top:0.4rem; line-height:1.4; font-style:italic; }

@media(max-width:768px) {
  .eval-cols { grid-template-columns:1fr; }
  .header,main,.tabs,.sf2-status { padding-left:1rem; padding-right:1rem; }
  .sample-grid { grid-template-columns:1fr; }
  .sample-metrics { grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>

<div class="header">
  <h1><span>Liszt</span> Engine Lab</h1>
  <p>Piano AI Engine Training History & Generated Samples</p>
</div>
<div class="sf2-status">
  <div class="sf2-dot loading" id="sf2dot"></div>
  <span id="sf2text">Loading Grand Piano SoundFont...</span>
</div>
<div class="tabs" id="tabs"></div>
<main id="main"></main>

<script>
// === DATA ===
const VERSIONS = {
  baseline: {
    title: 'Baseline (Aria)',
    badge: 'reference', badgeClass: '',
    training: {
      model: 'aria-medium-base (원본)',
      data: '사전학습 ~118만곡 (Aria-MIDI)',
      epochs: '-',
      val_loss: '-',
      strategy: 'EleutherAI 공개 체크포인트 (파인튜닝 전)',
      result: '기준선. 다양한 temp/토큰 수에서 생성 테스트',
    },
    evaluation: {
      summary: '기본 화성학과 피아노 패턴은 학습되어 있으나, 음악적 구조와 다이나믹이 부족.',
      strengths: ['MIDI 토큰 문법 이해', '기본적인 음 배치 가능', 'temp에 따른 다양성 변화 확인'],
      weaknesses: ['낮은 temp(0.5~0.7)에서 극심한 반복 (rep 95~99%)', '음역이 좁음 (2~16 unique pitches)', '구조/전개 없이 패턴 반복', '다이나믹 표현 단조로움'],
      verdict: '파인튜닝 없이는 음악적 결과물 생성 불가. 학습의 필요성을 명확히 보여주는 기준선.'
    }
  },
  v1: {
    title: 'Liszt v1',
    badge: 'foundation', badgeClass: 'success',
    training: {
      model: 'aria-medium → fine-tune',
      data: '1,433,433곡 전체 큐레이션 셋 (17.4GB)',
      epochs: '3 epochs, bs=1, grad_acc=8, bf16, seq_len=8192',
      val_loss: '3.33 → 1.94',
      strategy: '전체 데이터로 기초 체력 확보',
      result: '다이나믹/음역 개선. 반복 문제 + 구조 부재 + 에튀드 과다학습',
      duration: '6시간',
    },
    evaluation: {
      summary: '143만곡 학습으로 음악적 기초 체력 대폭 향상. 그러나 에튀드 데이터 과다로 기계적 반복 패턴 발생.',
      strengths: ['음역 확대 (45 unique pitches)', '다이나믹 범위 개선 (vel_range 60~90)', 'val_loss 3.33→1.94 대폭 하락', '긴 시퀀스(2048+tok) 생성 안정적'],
      weaknesses: ['반복률 35~71% — 에튀드 스케일 패턴 과다 학습', '구조적 전개 부재 (A-B-A 같은 형식 없음)', '일부 샘플에서 음역이 좁아지는 현상'],
      verdict: '기초 모델로서 성공. 전체 데이터의 양이 화성학/연주 테크닉 기반을 만들어줌. 하지만 데이터 품질 필터링의 중요성을 보여줌.',
      lesson: '대량 학습은 기초 체력에 좋지만, 데이터 내 에튀드/스케일 비중이 높으면 반복 패턴을 학습하게 됨.'
    }
  },
  v2: {
    title: 'Liszt v2',
    badge: 'overfitting', badgeClass: 'fail',
    training: {
      model: 'v1 epoch3 위에 추가 학습',
      data: 'tier1 3,218곡 (ATEPP+MAESTRO+ASAP, train 3,057/val 161)',
      epochs: '5 epochs, spc=500, LR=3e-4',

// === SF2 LOADING ===
async function loadSF2() {
  const dot = document.getElementById('sf2dot');
  const txt = document.getElementById('sf2text');
  try {
    audioCtx = new AudioContext({ sampleRate: 44100 });
    sfSynth = new JSSynth.AudioWorkletNodeSynthesizer();
    await sfSynth.createAudioNode(audioCtx);
    sfSynth.connect(audioCtx.destination);

    const sf2Resp = await fetch('piano.sf2');
    const sf2Buf = await sf2Resp.arrayBuffer();
    await sfSynth.loadSFont(sf2Buf);
    sfSynth.midiProgramSelect(0, 0, 0, 0); // Grand Piano

    sfReady = true;
    dot.className = 'sf2-dot ready';
    txt.textContent = 'Grand Piano SoundFont loaded';
  } catch(e) {
    console.error('SF2 load error:', e);
    // Fallback: Web Audio API oscillator synth
    if (!audioCtx) audioCtx = new AudioContext({ sampleRate: 44100 });
    sfReady = false;
    useFallback = true;
    dot.className = 'sf2-dot ready';
    txt.textContent = 'Web Audio Synth (piano SF2 unavailable)';
  }
}

let useFallback = false;
function fallbackNoteOn(note, velocity, time) {
  if (!audioCtx) return;
  const freq = 440 * Math.pow(2, (note - 69) / 12);
  const gain = audioCtx.createGain();
  const osc = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  osc.type = 'sine';
  osc2.type = 'triangle';
  osc.frequency.value = freq;
  osc2.frequency.value = freq * 2;
  const vol = (velocity / 127) * 0.15;
  gain.gain.setValueAtTime(vol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 2);
  osc.connect(gain);
  osc2.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc2.start(time);
  osc.stop(time + 2.5);
  osc2.stop(time + 2.5);
}

// === MIDI PLAYBACK ===
let playbackTimer = null;
let playbackStart = 0;
let playbackDuration = 0;
let scheduledNotes = [];

async function togglePlay(cardId, midiPath) {
  const card = document.getElementById(cardId);
  if (currentPlayer === cardId) { stopPlay(); return; }
  if (currentPlayer) stopPlay();

  if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();

  try {
    const midiData = await Midi.fromUrl(midiPath);
    const notes = midiData.tracks.flatMap(t => t.notes);
    if (!notes.length) return;

    playbackDuration = Math.max(...notes.map(n => n.time + n.duration));
    currentPlayer = cardId;
    card.classList.add('playing');
    const btn = card.querySelector('.pbtn');
    btn.classList.add('on');
    btn.innerHTML = pauseIcon;

    playbackStart = audioCtx.currentTime;
    if (sfReady) {
      for (const note of notes) {
        const vel = Math.round(note.velocity * 127);
        scheduledNotes.push(
          setTimeout(() => sfSynth.midiNoteOn(0, note.midi, vel), note.time * 1000),
          setTimeout(() => sfSynth.midiNoteOff(0, note.midi), (note.time + note.duration) * 1000)
        );
      }
    } else if (useFallback) {
      for (const note of notes) {
        const vel = Math.round(note.velocity * 127);
        scheduledNotes.push(
          setTimeout(() => fallbackNoteOn(note.midi, vel, audioCtx.currentTime), note.time * 1000)
        );
      }
    }

    const progEl = document.getElementById('prog-' + cardId);
    const timeEl = document.getElementById('time-' + cardId);
    const update = () => {
      if (currentPlayer !== cardId) return;
      const elapsed = audioCtx.currentTime - playbackStart;
      const pct = Math.min(100, (elapsed / playbackDuration) * 100);
      progEl.style.width = pct + '%';
      timeEl.textContent = fmtTime(elapsed) + ' / ' + fmtTime(playbackDuration);
      if (elapsed < playbackDuration + 1) playbackTimer = requestAnimationFrame(update);
      else stopPlay();
    };
    playbackTimer = requestAnimationFrame(update);
  } catch(e) { console.error(e); }
}

function stopPlay() {
  if (playbackTimer) cancelAnimationFrame(playbackTimer);
  scheduledNotes.forEach(t => clearTimeout(t));
  scheduledNotes = [];
  if (sfReady) sfSynth.midiAllSoundsOff(0);
  if (currentPlayer) {
    const card = document.getElementById(currentPlayer);
    if (card) {
      card.classList.remove('playing');
      const btn = card.querySelector('.pbtn');
      btn.classList.remove('on');
      btn.innerHTML = playIcon;
    }
  }
  currentPlayer = null;
}

const playIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';

async function drawPianoRoll(canvasId, midiPath) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2,2);
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  try {
    const mid = await Midi.fromUrl(midiPath);
    const notes = mid.tracks.flatMap(t => t.notes);
    if (!notes.length) return;
    const minP = Math.min(...notes.map(n=>n.midi));
    const maxP = Math.max(...notes.map(n=>n.midi));
    const maxT = Math.max(...notes.map(n=>n.time+n.duration));
    const pr = maxP - minP + 1;
    for (const n of notes) {
      const x = (n.time/maxT)*w;
      const nw = Math.max(1,(n.duration/maxT)*w);
      const y = h - ((n.midi-minP+1)/pr)*h;
      const nh = Math.max(1, h/pr);
      const hue = 240 + n.velocity*60;
      ctx.fillStyle = `hsla(${hue},80%,60%,${0.4+n.velocity*0.6})`;
      ctx.fillRect(x,y,nw,nh);
    }
  } catch(e) {}
}

              <div class="piano-roll"><canvas id="cvs-${cardId}"></canvas></div>
              <div class="player-bar">
                <button class="pbtn" onclick="togglePlay('${cardId}','${mpath}')">${playIcon}</button>
                <div class="pbar"><div class="pfill" id="prog-${cardId}"></div></div>
                <div class="ptime" id="time-${cardId}">0:00 / ${fmtTime(s.duration_sec||0)}</div>
              </div>
            </div>`;
        }
      }
      html += '</div></div>';
    }
  } else {
    // Regular version samples
    const samples = allSamples[vKey] || [];
    if (samples.length) {
      html += '<div class="sample-grid">';
      for (const s of samples) {
        const cardId = (vKey+'-'+s.file).replace(/[\/\.]/g,'-');
        const mpath = 'midi/'+vKey+'/'+s.file;
        html += renderSampleCard(s, mpath, cardId);
      }
      html += '</div>';
    }
  }
  html += '</div>';
  return html;
}

function renderEmbedding() {

  const vColors = { 'v0 (base)':'#3b82f6', 'v1':'#22c55e', 'v2':'#ef4444', 'v3':'#eab308', 'unknown':'#71717a' };

  // Histogram helper
  function makeHistogram(values, bins=8, color='var(--accent)') {
    const mn = Math.min(...values), mx = Math.max(...values);
    const step = (mx - mn) / bins || 1;
    const counts = Array(bins).fill(0);
    values.forEach(v => { const b = Math.min(bins-1, Math.floor((v-mn)/step)); counts[b]++; });
    const maxC = Math.max(...counts);
    return counts.map((c,i) => {
      const label = (mn + i*step).toFixed(1);
      const pct = maxC ? (c/maxC*100) : 0;
      return `<div class="dist-bar-wrap">
        <span class="dist-label">${label}</span>
        <div class="dist-bar" style="width:${pct}%;background:${color}"></div>
        <span class="dist-val">${c}</span>
      </div>`;
    }).join('');

      return entries.map(([k,v]) => {

        const col = (colorMap && colorMap[k]) || defaultColor || 'var(--accent)';
        return '<div class="hbar-wrap">' +
          '<span class="hbar-label">' + k + '</span>' +
          '<div class="hbar" style="width:' + pct + '%;background:' + col + '"></div>' +
          '<span class="hbar-val">' + v + '</span>' +
        '</div>';
      }).join('');
    }

    html += `
    <!-- Clustering Results -->
    <div class="cluster-section-title">
      K-Means Clustering 결과 <span class="csub">— ${cl.total_phrases.toLocaleString()}개 프레이즈, K=${cl.k_optimal}</span>
    </div>

    <!-- K-value Search Chart -->
    <div class="k-chart-wrap">
      <h3>K-value 탐색 — Silhouette Score</h3>
      <div class="k-chart-canvas">
        <canvas id="k-chart-cvs"></canvas>
      </div>
    </div>

    <!-- Style Distribution Summary -->
    <div class="style-dist-grid">
      <div class="style-dist-card">
        <h4>Register 분포</h4>
        ${hbarChart(regCounts, regColors)}
      </div>
      <div class="style-dist-card">
        <h4>Dynamic 분포</h4>
        ${hbarChart(dynCounts, dynColors)}
      </div>
      <div class="style-dist-card">
        <h4>Texture 분포</h4>
        ${hbarChart(texCounts, texColors)}
      </div>
      <div class="style-dist-card">
        <h4>Span 분포</h4>
        ${hbarChart(spanCounts, null, 'var(--accent2)')}
      </div>
    </div>

    <!-- Top 20 Clusters -->
    <div class="analysis-card">
      <h3>Top 20 Clusters (by size)</h3>
    </div>
    <div class="cluster-grid">
      ${top20.map(p => {
        const dynClass = 'dyn-' + p.dynamic;
        const regClass = 'reg-' + p.register;
        return '<div class="cluster-card" style="border-left:3px solid ' + (dynColors[p.dynamic]||'var(--accent)') + '">' +
          '<div class="cluster-card-head">' +
            '<h4>Cluster #' + p.cluster_id + '</h4>' +
            '<span class="cl-size">' + p.size.toLocaleString() + '개 (' + p.pct + '%)</span>' +
          '</div>' +
          '<div class="cluster-tags">' +
            '<span class="cl-tag ' + regClass + '">' + p.register + '</span>' +
            '<span class="cl-tag ' + dynClass + '">' + p.dynamic + '</span>' +
            '<span class="cl-tag tex">' + p.texture + '</span>' +
            '<span class="cl-tag span-tag">' + p.span + '</span>' +
          '</div>' +
          '<div class="cluster-stats">' +
            '<div class="cl-st"><div class="cl-sv">' + p.stats.avg_pitch.toFixed(1) + '</div><div class="cl-sl">Avg Pitch</div></div>' +
            '<div class="cl-st"><div class="cl-sv">' + p.stats.avg_velocity.toFixed(1) + '</div><div class="cl-sl">Avg Vel</div></div>' +
            '<div class="cl-st"><div class="cl-sv">' + p.stats.avg_density_nps.toFixed(1) + '</div><div class="cl-sl">NPS</div></div>' +
          '</div>' +
          '<div class="cluster-sources">' +
            '<strong>Top sources:</strong> ' + p.top_sources.slice(0,3).map(s => s.source.replace(/_/g,' ') + ' (' + s.count + ')').join(', ') +
          '</div>' +
        '</div>';
      }).join('')}
    </div>

    <!-- Clustering Insights -->
    <div class="analysis-card">
      <h3>클러스터링 분석 요약</h3>
      <div class="analysis-text">
        <strong>규모:</strong> tier1 프로 연주 데이터 <span class="insight">${cl.total_files.toLocaleString()}개 파일</span>에서 추출한
        <span class="insight">${cl.total_phrases.toLocaleString()}개 프레이즈</span>를 K=${cl.k_optimal}로 클러스터링했습니다.<br><br>

        <strong>K-value 탐색:</strong> K=20~150 범위에서 Silhouette Score 비교 결과,
        <span class="insight">K=20 (Score: ${cl.k_search[0].silhouette})</span>이 최고점이나
        표현력 확보를 위해 K=${cl.k_optimal}를 선택했습니다. Score ${cl.k_search.find(r=>r.k===cl.k_optimal)?.silhouette || 'N/A'}.<br><br>

        <strong>스타일 분포:</strong>
        Register는 <span class="insight">alto(${regCounts['alto']||0})</span>가 압도적이며 tenor(${regCounts['tenor']||0})는 소수입니다.
        Dynamic은 <span class="insight">mp(${dynCounts['mp']||0})</span>가 가장 많고, p(${dynCounts['p']||0}), mf(${dynCounts['mf']||0}), f(${dynCounts['f']||0}) 순입니다.
        Texture는 <span class="insight">dense(${texCounts['dense']||0})</span>가 주류이며, moderate(${texCounts['moderate']||0}), virtuosic(${texCounts['virtuosic']||0})가 뒤따릅니다.<br><br>

        <strong>활용 방향:</strong><br>
        &#8226; 각 클러스터의 style_label을 conditioning token으로 활용 가능<br>
        &#8226; 대표 프레이즈 선별 → few-shot prompting / prefix 생성<br>
        &#8226; f/virtuosic 클러스터는 희소 → data augmentation 또는 특화 학습 필요<br>
        &#8226; alto 편향 해소를 위한 register-balanced sampling 검토
      </div>
    </div>
  </div>`;
  } else {
    html += '</div>';
  }

  return html;
}

function drawTSNE() {
  if (!embeddingData) return;
  const canvas = document.getElementById('tsne-cvs');
  if (!canvas) return;
  const container = document.getElementById('tsne-container');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = container.offsetWidth;
  const h = 500;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  const vColors = { 'v0 (base)':'#3b82f6', 'v1':'#22c55e', 'v2':'#ef4444', 'v3':'#eab308', 'unknown':'#71717a' };
  const points = embeddingData.tsne;
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const mnx = Math.min(...xs), mxx = Math.max(...xs);
  const mny = Math.min(...ys), mxy = Math.max(...ys);
  const pad = 30;

  function tx(x) { return pad + (x-mnx)/(mxx-mnx) * (w-2*pad); }
  function ty(y) { return pad + (y-mny)/(mxy-mny) * (h-2*pad); }

  // Draw points
  for (const p of points) {
    const px = tx(p.x), py = ty(p.y);
    const col = vColors[p.version] || '#71717a';
    ctx.beginPath();
    ctx.arc(px, py, 4, 0, Math.PI*2);
    ctx.fillStyle = col + 'cc';
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Tooltip on hover
  const tip = document.getElementById('tsne-tip');
  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    let closest = null, minDist = 20;
    for (let i = 0; i < points.length; i++) {
      const px = tx(points[i].x), py = ty(points[i].y);
      const dist = Math.sqrt((mx-px)**2 + (my-py)**2);
      if (dist < minDist) { minDist = dist; closest = i; }
    }
    if (closest !== null) {
      const p = points[closest];
      tip.style.display = 'block';
      tip.style.left = (tx(p.x) + 12) + 'px';
      tip.style.top = (ty(p.y) - 10) + 'px';
      tip.innerHTML = `<strong>${p.file}</strong><br>
        Version: ${p.version} | Phrase #${p.phrase_idx}<br>
        Duration: ${p.duration}s | Notes: ${p.num_notes}<br>
        Pitch: ${p.avg_pitch} (${p.pitch_range[0]}~${p.pitch_range[1]})<br>
        Velocity: ${p.avg_velocity}`;
    } else {
      tip.style.display = 'none';
    }
  };
  canvas.onmouseleave = () => { tip.style.display = 'none'; };
}

function drawKChart() {
  const cl = testSuiteReport.clustering;
  if (!cl || !cl.k_search) return;
  const canvas = document.getElementById('k-chart-cvs');
  if (!canvas) return;
  const parent = canvas.parentElement;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = parent.offsetWidth;
  const h = 220;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  const data = cl.k_search;
  const pad = { top:20, right:40, bottom:40, left:60 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;

  const ks = data.map(d => d.k);
  const sils = data.map(d => d.silhouette);
  const minK = Math.min(...ks), maxK = Math.max(...ks);
  const minS = Math.min(...sils) * 0.9, maxS = Math.max(...sils) * 1.1;

  function tx(k) { return pad.left + (k - minK) / (maxK - minK) * cw; }
  function ty(s) { return pad.top + (1 - (s - minS) / (maxS - minS)) * ch; }

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ch / 4) * i;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
  }

  // Line
  ctx.beginPath();
  ctx.strokeStyle = '#6366f1';
  ctx.lineWidth = 2;
  data.forEach((d, i) => {
    const x = tx(d.k), y = ty(d.silhouette);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Points
  data.forEach(d => {
    const x = tx(d.k), y = ty(d.silhouette);
    const isOpt = d.k === cl.k_optimal;
    ctx.beginPath();
    ctx.arc(x, y, isOpt ? 7 : 5, 0, Math.PI * 2);
    ctx.fillStyle = isOpt ? '#22c55e' : '#6366f1';
    ctx.fill();
    ctx.strokeStyle = isOpt ? '#22c55e' : '#6366f1';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Labels
    ctx.fillStyle = '#fafafa';
    ctx.font = '11px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.silhouette.toFixed(4), x, y - 12);
  });

  // X-axis labels
  ctx.fillStyle = '#71717a';
  ctx.font = '11px Inter, sans-serif';
  ctx.textAlign = 'center';
  data.forEach(d => {
    ctx.fillText('K=' + d.k, tx(d.k), h - pad.bottom + 20);
  });

  // Y-axis label
  ctx.save();
  ctx.translate(15, h / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillText('Silhouette Score', 0, 0);
  ctx.restore();

  // Mark optimal
  const optData = data.find(d => d.k === cl.k_optimal);
  if (optData) {
    ctx.fillStyle = '#22c55e';
    ctx.font = 'bold 11px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('← 선택', tx(optData.k) + 30, ty(optData.silhouette) + 4);
  }
}

function render() {
  const activeTab = document.querySelector('.tab.active')?.dataset.tab || 'all';
  let html = '';
  if (activeTab === 'arch') {
    html = renderArchitecture();
  } else if (activeTab === 'embedding') {
    html = renderEmbedding();
  } else {
    for (const vKey of Object.keys(VERSIONS)) {
      if (activeTab !== 'all' && activeTab !== vKey) continue;
      html += renderVersion(vKey);
    }
  }
  document.getElementById('main').innerHTML = html;

  // Draw piano rolls
  requestAnimationFrame(() => {
    document.querySelectorAll('.piano-roll canvas').forEach(canvas => {
      const cardId = canvas.id.replace('cvs-','');
      const card = document.getElementById(cardId);
      if (!card) return;
      const btn = card.querySelector('.pbtn');
      if (!btn) return;
      const mpath = btn.getAttribute('onclick').match(/'([^']+midi[^']+)'/)?.[1];
      if (mpath) drawPianoRoll(canvas.id, mpath);
    });
    // Draw t-SNE if embedding tab
    if (activeTab === 'embedding') { drawTSNE(); drawKChart(); }
  });
}

// === INIT ===
async function init() {
  // Load data
  const [samplesResp, reportResp] = await Promise.all([
    fetch('all_samples.json'),
    fetch('test_suite_report.json'),
  ]);
  allSamples = await samplesResp.json();
  testSuiteReport = await reportResp.json();
  // Load embedding data from test_suite_report (merged) or standalone file
  if (testSuiteReport.embedding) {
    embeddingData = testSuiteReport.embedding;
  } else {
    try {
      const embResp = await fetch('embedding_data.json');
      if (embResp.ok) embeddingData = await embResp.json();
    } catch(e) {}
  }

  // Build tabs
  const tabsEl = document.getElementById('tabs');
  const tabDefs = [
    ['all','All Versions'],
    ['baseline','Baseline'],
    ['v1','v1 (Foundation)'],
    ['v2','v2 (Overfitting)'],
    ['v3','v3'],
    ['v4','v4 (Style Cond.)'],
    ['v3_test','v3 Test Suite'],
    ['arch','Architecture'],
    ['embedding','Embedding'],
  ];
  tabsEl.innerHTML = tabDefs.map(([k,l],i)=>
    `<button class="tab ${i===0?'active':''}" data-tab="${k}">${l}</button>`
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    stopPlay();
    tabsEl.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    render();
  }));

  render();
  loadSF2();
}

init();
