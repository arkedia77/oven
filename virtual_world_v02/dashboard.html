<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>하모니 시티</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0c0e14;--card:#12141d;--border:#1e2235;--text:#d4d4d4;--dim:#6b7280;--accent:#818cf8;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--pink:#ec4899;--amber:#f59e0b;--purple:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden}

/* Header */
.hdr{background:#111320;padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.hdr h1{font-size:1.2em;color:var(--accent)}
.hdr-right{display:flex;align-items:center;gap:12px}
.badge{padding:4px 10px;border-radius:12px;font-size:.75em;font-weight:700}
.badge-live{background:#0a2a0a;color:#4ade80;border:1px solid #1a4a1a}
.badge-stale{background:#2a0a0a;color:#f87171;border:1px solid #4a1a1a}
.clock{color:var(--dim);font-size:.85em}
.tick-lbl{color:var(--accent);font-weight:600}

/* Layout: 3 columns */
.layout{display:grid;grid-template-columns:260px 1fr 300px;height:calc(100vh - 50px)}
@media(max-width:1100px){.layout{grid-template-columns:240px 1fr}}
@media(max-width:750px){.layout{grid-template-columns:1fr}}

/* Left: Characters */
.sidebar{border-right:1px solid var(--border);overflow-y:auto;padding:8px}
.sec-title{font-size:.75em;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;padding:8px 8px 4px}
.char{padding:8px;margin-bottom:2px;border-radius:6px;cursor:pointer;transition:background .15s}
.char:hover,.char.active{background:#1a1d2e}
.char-top{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.char-nm{font-size:.88em;font-weight:600;flex:1}
.char-nrg{font-size:.7em;color:var(--green)}
.char-sub{font-size:.73em;color:var(--dim);padding-left:16px}
.char-mood{color:var(--purple)}
.needs-row{display:flex;gap:2px;margin-top:3px;padding-left:16px}
.need-pip{width:16px;height:4px;border-radius:2px;opacity:.3;transition:opacity .3s}
.need-pip.high{opacity:1}.need-pip.mid{opacity:.6}

/* Center: Live feed */
.feed{overflow-y:auto;border-right:1px solid var(--border)}
.feed-inner{padding:12px 16px}
.tick-sep{text-align:center;padding:8px;color:var(--dim);font-size:.75em;border-bottom:1px solid var(--border);margin:12px 0;position:relative}
.tick-sep span{background:var(--bg);padding:0 12px;position:relative}
.conv-item{margin-bottom:16px;border-left:3px solid var(--border);padding:4px 0 4px 12px;transition:border-color .3s}
.conv-item.fresh{border-color:var(--accent);animation:fadein .5s}
@keyframes fadein{from{opacity:.3}to{opacity:1}}
.conv-meta{font-size:.73em;color:var(--dim);margin-bottom:4px;display:flex;gap:8px}
.conv-loc{color:var(--amber)}
.bubble{margin:3px 0;font-size:.88em}
.bubble .nm{font-weight:600;margin-right:4px}
.bubble .txt{color:#ccc}
.refl{font-size:.78em;color:var(--purple);font-style:italic;margin:2px 0 2px 12px;border-left:2px solid #3b3060;padding-left:8px}
.mono{font-size:.82em;color:#8b9dc3;margin:6px 0;padding:6px 10px;background:#111828;border-radius:6px;font-style:italic}

/* Right: Delta tracker + relationships */
.right-panel{overflow-y:auto;padding:8px}
.delta-card{background:var(--card);border-radius:6px;padding:10px;margin-bottom:8px}
.delta-title{font-size:.75em;font-weight:700;color:var(--dim);margin-bottom:6px}
.delta-row{display:flex;align-items:center;font-size:.8em;padding:2px 0}
.delta-label{flex:1;color:var(--dim)}
.delta-val{font-weight:600;min-width:40px;text-align:right}
.delta-val.up{color:var(--green)}.delta-val.down{color:var(--red)}.delta-val.flat{color:var(--dim)}
.delta-arrow{font-size:.7em;margin-left:4px}

/* Relationship mini */
.rel-pair{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #1a1d28;font-size:.78em}
.rel-nm{width:100px;flex-shrink:0;color:var(--dim)}
.rel-dots{display:flex;gap:3px;flex:1}
.rel-dot{height:6px;border-radius:3px;min-width:2px;transition:width .5s}

/* Goal */
.goal{font-size:.78em;padding:4px 0;border-bottom:1px solid #1a1d28}
.goal-desc{color:var(--text)}
.goal-prog{display:flex;align-items:center;gap:6px;margin-top:2px}
.goal-bar{flex:1;height:4px;background:#1a1d28;border-radius:2px;overflow:hidden}
.goal-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .5s}
.goal-pct{font-size:.7em;color:var(--dim);width:30px;text-align:right}
.allies{font-size:.7em;color:var(--green)}.blockers{font-size:.7em;color:var(--red)}

/* Tab bar */
.tabs{display:flex;border-bottom:1px solid var(--border);background:#111320}
.tab{padding:8px 14px;font-size:.78em;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--accent);border-color:var(--accent)}

/* Header mode switcher */
.mode-tabs{display:flex;gap:2px;background:#1a1d2e;border-radius:6px;padding:2px}
.mode-tab{padding:5px 14px;font-size:.78em;color:var(--dim);cursor:pointer;border-radius:4px;transition:all .2s}
.mode-tab.active{background:var(--accent);color:#fff}

/* Evolution view */
.evo-view{display:none;height:calc(100vh - 50px);grid-template-columns:200px 1fr;overflow:hidden}
.evo-view.visible{display:grid}
.evo-sidebar{border-right:1px solid var(--border);overflow-y:auto;padding:8px}
.evo-char{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:.85em;margin-bottom:2px;transition:background .15s;display:flex;align-items:center;gap:8px}
.evo-char:hover,.evo-char.active{background:#1a1d2e}
.evo-char .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.evo-main{overflow-y:auto;padding:20px 24px}
.evo-section{margin-bottom:28px}
.evo-section-title{font-size:.85em;font-weight:700;color:var(--accent);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
.chart-label{font-size:.75em;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between}
.chart-label .val{color:var(--text);font-weight:600}
.chart-canvas{width:100%;height:80px}
.evo-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.evo-legend-item{font-size:.72em;display:flex;align-items:center;gap:4px}
.evo-legend-dot{width:8px;height:8px;border-radius:50%}
.evo-no-data{color:var(--dim);font-size:.85em;padding:20px;text-align:center}
.evo-rel-selector{margin-bottom:12px}
.evo-rel-selector select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:.8em}

/* Evolution annotations */
.evo-section-desc{font-size:.78em;color:#6b7280;font-style:italic;margin:-6px 0 14px;line-height:1.5}
.evo-insight{background:#111828;border:1px solid #1e2a40;border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:.8em;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.evo-insight-item{display:flex;align-items:center;gap:5px}
.evo-insight-label{color:var(--dim);font-size:.85em}
.evo-insight-val{font-weight:600}
.chart-annotation{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0 0;gap:8px}
.chart-desc{font-size:.7em;color:#5a6270;flex:1;line-height:1.4}
.trend-badge{font-size:.68em;padding:2px 8px;border-radius:10px;white-space:nowrap;font-weight:600}
.trend-up{background:#0a2a0a;color:#4ade80;border:1px solid #1a4a1a}
.trend-down{background:#2a0a0a;color:#f87171;border:1px solid #4a1a1a}
.trend-stable{background:#1a1d2e;color:#818cf8;border:1px solid #2e3352}
.trend-nodata{background:#1a1a1a;color:#555;border:1px solid #2a2a2a}
.rel-context-tag{display:inline-block;font-size:.65em;padding:1px 6px;border-radius:8px;margin-left:4px;font-weight:600}
.rel-ally{background:#0a2a0a;color:#4ade80;border:1px solid #1a4a1a}
.rel-blocker{background:#2a0a0a;color:#f87171;border:1px solid #4a1a1a}

/* Avatar view */
.avatar-view{display:none;height:calc(100vh - 50px);grid-template-columns:200px 1fr;overflow:hidden}
.avatar-view.visible{display:grid}
.av-sidebar{border-right:1px solid var(--border);overflow-y:auto;padding:8px}
.av-main{overflow-y:auto;padding:20px 24px}
.av-profile{display:flex;align-items:center;gap:16px;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px}
.av-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4em;font-weight:700;color:#fff;flex-shrink:0}
.av-info{flex:1;min-width:0}
.av-name{font-size:1.05em;font-weight:700}
.av-role{font-size:.75em;color:var(--dim);margin-top:1px}
.av-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.av-badge{padding:2px 8px;border-radius:10px;font-size:.72em;font-weight:600}
.av-badge-emotion{background:#1a1d2e;color:var(--purple)}
.av-badge-energy{background:#0a1a0a;color:var(--green);border:1px solid #1a3a1a}
.av-energy-bar{width:50px;height:5px;background:#1a1d28;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:4px}
.av-energy-fill{height:100%;border-radius:3px}
.av-scene{background:linear-gradient(135deg,#111828,#12141d);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.av-scene-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.av-scene-name{font-size:.95em;font-weight:700;color:var(--amber)}
.av-scene-vibe{font-size:.7em;color:var(--dim);font-style:italic}
.av-scene-desc{font-size:.78em;color:#6b7fa3;margin-bottom:10px;line-height:1.5}
.av-scene-people{display:flex;flex-wrap:wrap;gap:6px}
.av-person{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:14px;background:#1a1d2e;font-size:.78em;border:1px solid var(--border)}
.av-person .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.av-person-rel{font-size:.65em;color:var(--dim);margin-left:2px}
.av-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.av-grid{grid-template-columns:1fr}}
.av-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.av-card-title{font-size:.72em;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.av-need-row{display:flex;align-items:center;gap:6px;padding:2px 0}
.av-need-label{width:28px;font-size:.72em;color:var(--dim)}
.av-need-bar{flex:1;height:7px;background:#1a1d28;border-radius:4px;overflow:hidden}
.av-need-fill{height:100%;border-radius:4px;transition:width .5s}
.av-need-val{width:28px;text-align:right;font-size:.7em;font-weight:600}
.av-persona-text{font-size:.78em;color:#7b8ba3;line-height:1.6}
.av-secret{font-size:.75em;color:#f87171;background:#1a0808;padding:6px 10px;border-radius:6px;border:1px solid #3a1515;margin-top:8px}
.av-secret b{margin-right:4px}
.av-stance{font-size:.75em;color:#60a5fa;background:#080f1a;padding:6px 10px;border-radius:6px;border:1px solid #152a3a;margin-top:6px}
.av-stance b{margin-right:4px}
.av-convs{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px}
.av-conv-item{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #1a1d28}
.av-conv-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.av-conv-meta{font-size:.7em;color:var(--dim);margin-bottom:8px;display:flex;gap:8px}
.av-conv-loc{color:var(--amber)}
.av-msg{display:flex;margin:3px 0}
.av-msg.self{justify-content:flex-end}
.av-msg-bubble{max-width:78%;padding:7px 11px;border-radius:12px;font-size:.82em;line-height:1.5}
.av-msg.other .av-msg-bubble{background:#1a1d2e;border-bottom-left-radius:2px}
.av-msg.self .av-msg-bubble{background:#1e2a40;border-bottom-right-radius:2px}
.av-msg-nm{font-size:.68em;font-weight:600;margin-bottom:2px;opacity:.7}
.av-msg.self .av-msg-nm{text-align:right}
.av-goal-item{margin-bottom:10px}
.av-goal-desc{font-size:.8em;margin-bottom:4px}
.av-goal-bar{height:5px;background:#1a1d28;border-radius:3px;overflow:hidden}
.av-goal-fill{height:100%;background:var(--accent);border-radius:3px}
.av-goal-meta{font-size:.68em;color:var(--dim);margin-top:3px;display:flex;gap:8px}
.av-goal-allies{color:var(--green)}.av-goal-blockers{color:var(--red)}
.av-mem-item{font-size:.78em;padding:5px 0;border-bottom:1px solid #1a1d28;line-height:1.4}
.av-mem-item:last-child{border-bottom:none}
.av-mem-day{color:var(--accent);font-weight:600;font-size:.72em}
.av-mem-other{font-weight:600}
.av-sched-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:.78em}
.av-sched-time{width:55px;color:var(--dim);font-size:.72em}
.av-sched-dot{width:8px;height:8px;border-radius:50%;background:#1e2235;flex-shrink:0}
.av-sched-dot.now{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.av-sched-loc{flex:1}
.av-sched-now{color:var(--accent);font-weight:700}
.av-rel-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1a1d28;font-size:.8em}
.av-rel-item:last-child{border-bottom:none}
.av-rel-name{width:50px;font-weight:600;font-size:.78em;flex-shrink:0}
.av-rel-bars{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.av-rel-bar-wrap{height:6px;background:#1a1d28;border-radius:3px;overflow:hidden}
.av-rel-bar-fill{height:100%;border-radius:3px}
.av-rel-cnt{font-size:.68em;color:var(--dim);width:28px;text-align:right;flex-shrink:0}
.av-rel-legend{display:flex;gap:8px;margin-bottom:8px;font-size:.68em;color:var(--dim)}
.av-rel-legend span{display:flex;align-items:center;gap:3px}
.av-rel-legend .dot{width:6px;height:6px;border-radius:50%}
.av-no-data{color:var(--dim);font-size:.82em;padding:16px;text-align:center}
</style>
</head>
<body>
<div class="hdr">
  <h1>하모니 시티</h1>
  <div class="hdr-right">
    <div class="mode-tabs">
      <div class="mode-tab active" onclick="switchMode('live')">라이브</div>
      <div class="mode-tab" onclick="switchMode('evo')">변화 추이</div>
      <div class="mode-tab" onclick="switchMode('avatar')">아바타</div>
    </div>
    <span class="clock" id="clock"></span>
    <span class="badge badge-live" id="badge">LIVE</span>
  </div>
</div>
<div class="layout" id="live-view">
  <!-- Left: Characters -->
  <div class="sidebar" id="charlist"></div>

  <!-- Center: Live conversation feed -->
  <div class="feed" id="feed">
    <div class="feed-inner" id="feed-inner"></div>
  </div>

  <!-- Right: Delta tracker -->
  <div class="right-panel">
    <div class="tabs">
      <div class="tab active" data-tab="deltas">변화 추적</div>
      <div class="tab" data-tab="rels">관계</div>
      <div class="tab" data-tab="goals">목표</div>
    </div>
    <div id="tab-deltas" class="tab-body" style="padding:8px"></div>
    <div id="tab-rels" class="tab-body" style="padding:8px;display:none"></div>
    <div id="tab-goals" class="tab-body" style="padding:8px;display:none"></div>
  </div>
</div>
<div class="avatar-view" id="avatar-view">
  <div class="av-sidebar">
    <div class="sec-title">아바타 선택</div>
    <div id="av-charlist"></div>
  </div>
  <div class="av-main" id="av-main">
    <div class="av-no-data">주민을 선택하면 그 사람의 시점으로 세상을 봅니다</div>
  </div>
</div>
<div class="evo-view" id="evo-view">
  <div class="evo-sidebar">
    <div class="sec-title">주민 선택</div>
    <div id="evo-charlist"></div>
  </div>
  <div class="evo-main" id="evo-main">
    <div class="evo-no-data">주민을 선택하면 시간에 따른 변화를 볼 수 있습니다</div>
  </div>
</div>
<script>
const COLORS={aria:'#ec4899',luna:'#a78bfa',nexus:'#60a5fa',seo_jin:'#3b82f6',joon_ho:'#f59e0b',tae_sik:'#ef4444',sang_woo:'#10b981',ye_eun:'#f472b6',min_ah:'#fb923c',ha_yeon:'#34d399'};
const NEEDS=['belonging','purpose','security','recognition','autonomy','affection'];
const NEED_KR={belonging:'소속',purpose:'목적',security:'안전',recognition:'인정',autonomy:'자율',affection:'애정'};
const HOUR_KR={0:'자정',1:'심야',2:'심야',3:'심야',4:'심야',5:'새벽',6:'이른아침',7:'이른아침',8:'오전',9:'오전',10:'오전',11:'오전',12:'점심',13:'점심',14:'오후',15:'오후',16:'오후',17:'저녁',18:'저녁',19:'저녁',20:'밤',21:'밤',22:'밤',23:'밤'};
const LOC_KR={plaza:'하모니 광장',cafe:"민아 카페 '온기'",studio:'루나 스튜디오',lab:'융합연구실',council:'시의회 사무실',community_center:'하모니 커뮤니티 센터',residential:'주거 구역'};

let prev={chars:{},rels:{}};
let seenConvs=new Set();
let selectedChar=null;
let allChars=[];
let allRels={};
let lastTick=0;

// Tabs
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-body').forEach(x=>x.style.display='none');
  t.classList.add('active');
  document.getElementById('tab-'+t.dataset.tab).style.display='block';
}));

function delta(now,old){
  if(old===undefined)return{val:now,d:0,cls:'flat',arrow:''};
  const d=now-old;
  if(Math.abs(d)<0.001)return{val:now,d:0,cls:'flat',arrow:''};
  return{val:now,d,cls:d>0?'up':'down',arrow:d>0?'▲':'▼'};
}

function renderChars(chars){
  allChars=chars;
  const el=document.getElementById('charlist');
  el.innerHTML='<div class="sec-title">주민 ('+chars.length+')</div>'+chars.map(c=>{
    const col=COLORS[c.id]||'#888';
    const active=selectedChar===c.id?'active':'';
    const needs=(c.needs||{});
    const pips=NEEDS.map(k=>{
      const v=needs[k]||0;
      const lvl=v>0.7?'high':v>0.3?'mid':'';
      return `<div class="need-pip ${lvl}" style="background:${col}" title="${NEED_KR[k]} ${(v*100).toFixed(0)}%"></div>`;
    }).join('');
    return `<div class="char ${active}" onclick="selectChar('${c.id}')">
      <div class="char-top"><div class="dot" style="background:${col}"></div><span class="char-nm" style="color:${col}">${c.display_name}</span><span class="char-nrg">${(c.energy*100).toFixed(0)}%</span></div>
      <div class="char-sub">${c.location_name} <span class="char-mood">${c.emotional_state||''}</span></div>
      <div class="needs-row">${pips}</div>
    </div>`;
  }).join('');
}

function renderFeed(convs,state){
  const el=document.getElementById('feed-inner');
  let html='';
  let lastDay=0;
  convs.forEach(cv=>{
    const key=cv.timestamp||(cv._day+'_'+cv.hour+'_'+(cv.participants||[]).join(''));
    const fresh=!seenConvs.has(key);
    if(fresh)seenConvs.add(key);
    const d=cv._day||cv.day||0;
    if(d!==lastDay){
      html+=`<div class="tick-sep"><span>Day ${d}</span></div>`;
      lastDay=d;
    }
    const names=(cv.participants||[]).map(p=>{
      const ch=allChars.find(x=>x.id===p);

function renderDeltas(chars){
  const el=document.getElementById('tab-deltas');
  if(!selectedChar){
    el.innerHTML='<div style="color:#4a5568;font-size:.85em;padding:12px">← 주민을 선택하면 변화를 추적합니다</div>';

  }
  const c=chars.find(x=>x.id===selectedChar);
  if(!c){el.innerHTML='';return;}
  const old=prev.chars[c.id]||{};
  const col=COLORS[c.id]||'#888';

  let html=`<div class="delta-card"><div class="delta-title" style="color:${col}">${c.display_name} 상태 변화</div>`;
  // Energy
  const ed=delta(c.energy,old.energy);
  html+=`<div class="delta-row"><span class="delta-label">에너지</span><span class="delta-val ${ed.cls}">${(ed.val*100).toFixed(0)}% <span class="delta-arrow">${ed.arrow}</span></span></div>`;
  // Emotional state
  const moodChanged=old.emotional_state && old.emotional_state!==c.emotional_state;
  html+=`<div class="delta-row"><span class="delta-label">감정</span><span class="delta-val" style="color:${moodChanged?'var(--amber)':'var(--dim)'}">${c.emotional_state||'-'} ${moodChanged?'← '+old.emotional_state:''}</span></div>`;
  // Location
  const locChanged=old.location && old.location!==c.location;
  html+=`<div class="delta-row"><span class="delta-label">위치</span><span class="delta-val" style="color:${locChanged?'var(--amber)':'var(--dim)'}">${c.location_name} ${locChanged?'←':''}</span></div>`;
  html+=`</div>`;

  // Needs
  html+=`<div class="delta-card"><div class="delta-title">욕구</div>`;
  const oldNeeds=old.needs||{};
  NEEDS.forEach(k=>{
    const v=c.needs?.[k]||0;
    const d=delta(v,oldNeeds[k]);
    html+=`<div class="delta-row"><span class="delta-label">${NEED_KR[k]}</span>
      <div style="flex:1;height:6px;background:#1a1d28;border-radius:3px;margin:0 8px;overflow:hidden">
        <div style="width:${v*100}%;height:100%;background:${v>0.5?'var(--green)':v>0.2?'var(--amber)':'var(--red)'};border-radius:3px;transition:width .5s"></div>
      </div>
      <span class="delta-val ${d.cls}" style="font-size:.75em">${(v*100).toFixed(0)}% <span class="delta-arrow">${d.arrow}</span></span></div>`;
  });
  html+=`</div>`;

  // Beliefs
  if(c.beliefs){
    const BELIEF_KR={ai_consciousness:'AI 의식',ai_rights:'AI 권리',human_uniqueness:'인간 고유성',progress_good:'진보 긍정',community_priority:'공동체 우선'};
    const oldBeliefs=old.beliefs||{};
    html+=`<div class="delta-card"><div class="delta-title">신념</div>`;
    Object.entries(c.beliefs).forEach(([k,v])=>{
      const d=delta(v,oldBeliefs[k]);
      html+=`<div class="delta-row"><span class="delta-label">${BELIEF_KR[k]||k}</span><span class="delta-val ${d.cls}">${(v*100).toFixed(0)}% <span class="delta-arrow">${d.arrow}</span></span></div>`;
    });
    html+=`</div>`;
  }
  el.innerHTML=html;
}

function renderRels(rels,chars){
  allRels=rels;
  const el=document.getElementById('tab-rels');
  const pairs=Object.entries(rels).sort((a,b)=>(b[1].tension||0)-(a[1].tension||0));
  const REL_KR={warmth:'온기',trust:'신뢰',tension:'긴장',affection:'애정'};
  const REL_COL={warmth:'var(--blue)',trust:'var(--green)',tension:'var(--red)',affection:'var(--pink)'};

  let html='<div class="sec-title">범례: <span style="color:var(--blue)">●온기</span> <span style="color:var(--green)">●신뢰</span> <span style="color:var(--red)">●긴장</span> <span style="color:var(--pink)">●애정</span></div>';
  pairs.forEach(([key,r])=>{
    const[a,b]=key.split('|');
    const na=chars.find(c=>c.id===a)?.display_name||a;
    const nb=chars.find(c=>c.id===b)?.display_name||b;
    const oldR=prev.rels[key]||{};
    html+=`<div class="rel-pair"><span class="rel-nm">${na}—${nb}</span><div class="rel-dots">`;
    ['warmth','trust','tension','affection'].forEach(k=>{
      const v=Math.round((r[k]||0)*100);
      const ov=oldR[k]!==undefined?Math.round(oldR[k]*100):v;
      const changed=Math.abs(v-ov)>1;
      html+=`<div class="rel-dot" style="width:${Math.max(v,2)}%;background:${REL_COL[k]};${changed?'box-shadow:0 0 4px '+REL_COL[k]:''}" title="${REL_KR[k]} ${v}%${changed?' ('+((v-ov)>0?'+':'')+(v-ov)+'%)':''}"></div>`;
    });
    html+=`</div></div>`;
  });
  el.innerHTML=html;
}

}

function analyzeTrend(values){
  if(!values||values.length<3) return {direction:'nodata',text:'데이터 부족',cls:'trend-nodata'};
  const recent=values.slice(-5);
  const prev=values.slice(-10,-5);
  if(prev.length<2) return {direction:'nodata',text:'데이터 부족',cls:'trend-nodata'};
  const avgR=recent.reduce((a,b)=>a+b,0)/recent.length;
  const avgP=prev.reduce((a,b)=>a+b,0)/prev.length;
  const diff=avgR-avgP;
  const pct=Math.round(diff*100);
  if(Math.abs(diff)>0.08) return {direction:diff>0?'up':'down',text:(diff>0?'뚜렷한 상승':'뚜렷한 하락')+` ${pct>0?'+':''}${pct}%`,cls:diff>0?'trend-up':'trend-down'};
  if(Math.abs(diff)>0.03) return {direction:diff>0?'up':'down',text:(diff>0?'완만한 상승':'완만한 하락')+` ${pct>0?'+':''}${pct}%`,cls:diff>0?'trend-up':'trend-down'};
  return {direction:'stable',text:'안정적',cls:'trend-stable'};
}

function generateCharacterInsight(charId,charNeeds,charBeliefs,relPairs){
  const items=[];
  const c=allChars.find(x=>x.id===charId);
  if(!c) return '';

  // lowest need
  let minNeed=null,minVal=2;
  NEEDS.forEach(k=>{
    const arr=charNeeds[k]||[];
    const v=arr.length?arr[arr.length-1]:(c.needs?.[k]||0.5);
    if(v<minVal){minVal=v;minNeed=k;}
  });
  if(minNeed) items.push(`<span class="evo-insight-item"><span class="evo-insight-label">가장 결핍:</span><span class="evo-insight-val" style="color:${minVal<0.3?'var(--red)':'var(--amber)'}">${NEED_KR[minNeed]} ${Math.round(minVal*100)}%</span></span>`);

  // most changed belief
  let maxBDiff=0,maxBKey=null;
  Object.keys(BELIEF_DESCRIPTIONS).forEach(k=>{
    const arr=charBeliefs[k]||[];
    if(arr.length>=2){
      const d=Math.abs(arr[arr.length-1]-arr[0]);
      if(d>maxBDiff){maxBDiff=d;maxBKey=k;}
    }
  });
  const BELIEF_KR_SHORT={ai_consciousness:'AI 의식',ai_rights:'AI 권리',human_uniqueness:'인간 고유성',progress_good:'진보 긍정',community_priority:'공동체 우선'};
  if(maxBKey&&maxBDiff>0.01) items.push(`<span class="evo-insight-item"><span class="evo-insight-label">가장 큰 신념 변화:</span><span class="evo-insight-val" style="color:var(--purple)">${BELIEF_KR_SHORT[maxBKey]} ${maxBDiff>0?'+':''}${Math.round(maxBDiff*100)}%</span></span>`);

  // closest / most tense relationship
  let closestName='',closestVal=-1,tenseName='',tenseVal=-1;
  relPairs.forEach(pk=>{
    const cur=allRels[pk]||{};
    const[a,b]=pk.split('|');
    const other=a===charId?b:a;
    const nm=allChars.find(x=>x.id===other)?.display_name||other;
    if((cur.warmth||0)>closestVal){closestVal=cur.warmth||0;closestName=nm;}
    if((cur.tension||0)>tenseVal){tenseVal=cur.tension||0;tenseName=nm;}
  });
  if(closestName) items.push(`<span class="evo-insight-item"><span class="evo-insight-label">가장 가까운:</span><span class="evo-insight-val" style="color:var(--blue)">${closestName} (온기 ${Math.round(closestVal*100)}%)</span></span>`);
  if(tenseName&&tenseVal>0.3) items.push(`<span class="evo-insight-item"><span class="evo-insight-label">가장 긴장:</span><span class="evo-insight-val" style="color:var(--red)">${tenseName} (긴장 ${Math.round(tenseVal*100)}%)</span></span>`);

  if(!items.length) return '';
  return `<div class="evo-insight">${items.join('')}</div>`;
}

function drawLineChart(canvas,datasets,opts={}){
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth;
  const h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  ctx.scale(dpr,dpr);

  const pad={t:4,r:8,b:16,l:32};
  const cw=w-pad.l-pad.r;
  const ch=h-pad.t-pad.b;

  const maxLen=Math.max(...datasets.map(d=>d.values.length),1);
  const yMin=opts.yMin??0;
  const yMax=opts.yMax??1;

  ctx.fillStyle='#12141d';ctx.fillRect(0,0,w,h);

  // grid lines
  ctx.strokeStyle='#1e2235';ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++){
    const y=pad.t+ch-(ch*i/4);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
    ctx.fillStyle='#4a5568';ctx.font='9px sans-serif';ctx.textAlign='right';
    ctx.fillText(((yMax-yMin)*i/4+yMin).toFixed(1),pad.l-4,y+3);
  }

  // x-axis day labels
  ctx.fillStyle='#4a5568';ctx.font='9px sans-serif';ctx.textAlign='center';
  const step=Math.max(1,Math.floor(maxLen/6));
  for(let i=0;i<maxLen;i+=step){
    const x=pad.l+(cw*i/(maxLen-1||1));
    ctx.fillText('D'+(i+1),x,h-2);
  }

  // lines
  datasets.forEach(ds=>{
    if(!ds.values.length)return;
    ctx.strokeStyle=ds.color;ctx.lineWidth=1.5;ctx.lineJoin='round';
    ctx.beginPath();
    ds.values.forEach((v,i)=>{
      const x=pad.l+(cw*i/(maxLen-1||1));
      const y=pad.t+ch-ch*((v-yMin)/(yMax-yMin));
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
    // endpoint dot
    const last=ds.values[ds.values.length-1];
    const lx=pad.l+(cw*(ds.values.length-1)/(maxLen-1||1));
    const ly=pad.t+ch-ch*((last-yMin)/(yMax-yMin));
    ctx.fillStyle=ds.color;ctx.beginPath();ctx.arc(lx,ly,3,0,Math.PI*2);ctx.fill();
  });
}

    html+=`<div class="evo-legend">${NEEDS.map(k=>`<span class="evo-legend-item"><span class="evo-legend-dot" style="background:${NEED_COLORS[k]}"></span>${NEED_KR[k]}</span>`).join('')}</div></div>`;
    html+=`<div class="chart-grid" style="margin-top:12px">`;
    NEEDS.forEach(k=>{
      const arr=charNeeds[k]||[];
      const last=arr.length?arr[arr.length-1]:0;
      const first=arr.length?arr[0]:0;
      const diff=last-first;
      const diffStr=diff>=0?`+${(diff*100).toFixed(0)}%`:`${(diff*100).toFixed(0)}%`;
      const diffCol=diff>0.01?'var(--green)':diff<-0.01?'var(--red)':'var(--dim)';
      const trend=analyzeTrend(arr);
      html+=`<div class="chart-card"><div class="chart-label"><span>${NEED_KR[k]}</span><span class="val" style="color:${diffCol}">${(last*100).toFixed(0)}% (${diffStr})</span></div><canvas class="chart-canvas" id="chart-need-${k}"></canvas><div class="chart-annotation"><span class="chart-desc">${NEED_DESCRIPTIONS[k]||''}</span><span class="trend-badge ${trend.cls}">${trend.text}</span></div></div>`;
    });
    html+=`</div>`;
  } else { html+=`<div class="evo-no-data">아직 히스토리 데이터가 없습니다</div>`; }
  html+=`</div>`;

  // === BELIEFS ===
  const hasBeliefs=Object.values(charBeliefs).some(arr=>arr.length>0);
  html+=`<div class="evo-section"><div class="evo-section-title">신념 변화 (일별)</div>`;
  html+=`<div class="evo-section-desc">${SECTION_DESCRIPTIONS.beliefs}</div>`;
  if(hasBeliefs){
    html+=`<div class="chart-card"><canvas class="chart-canvas" id="chart-beliefs-all" style="height:140px"></canvas>`;
    html+=`<div class="evo-legend">${Object.keys(BELIEF_KR).map(k=>`<span class="evo-legend-item"><span class="evo-legend-dot" style="background:${BELIEF_COLORS[k]}"></span>${BELIEF_KR[k]}</span>`).join('')}</div></div>`;
    html+=`<div class="chart-grid" style="margin-top:12px">`;
    Object.entries(BELIEF_KR).forEach(([k,label])=>{
      const arr=charBeliefs[k]||[];
      const last=arr.length?arr[arr.length-1]:c.beliefs?.[k]||0;
      const trend=analyzeTrend(arr);
      html+=`<div class="chart-card"><div class="chart-label"><span>${label}</span><span class="val">${(last*100).toFixed(0)}%</span></div><canvas class="chart-canvas" id="chart-belief-${k}"></canvas><div class="chart-annotation"><span class="chart-desc">${BELIEF_DESCRIPTIONS[k]||''}</span><span class="trend-badge ${trend.cls}">${trend.text}</span></div></div>`;
    });
    html+=`</div>`;
  } else {
    if(c.beliefs){
      html+=`<div class="evo-no-data">히스토리 수집 시작 전 — 현재 값만 표시</div><div class="chart-grid">`;
      Object.entries(BELIEF_KR).forEach(([k,label])=>{
        const v=c.beliefs[k]||0;
        html+=`<div class="chart-card"><div class="chart-label"><span>${label}</span><span class="val">${(v*100).toFixed(0)}%</span></div><div style="height:6px;background:#1a1d28;border-radius:3px;overflow:hidden"><div style="width:${v*100}%;height:100%;background:${BELIEF_COLORS[k]};border-radius:3px"></div></div><div class="chart-annotation"><span class="chart-desc">${BELIEF_DESCRIPTIONS[k]||''}</span></div></div>`;
      });
      html+=`</div>`;
    } else { html+=`<div class="evo-no-data">신념 데이터 없음</div>`; }
  }
  html+=`</div>`;

  // === RELATIONSHIPS ===
  html+=`<div class="evo-section"><div class="evo-section-title">관계 변화 (일별)</div>`;
  html+=`<div class="evo-section-desc">${SECTION_DESCRIPTIONS.relationships}</div>`;

  // build ally/blocker lookup from current character's goals
  const allySet=new Set(),blockerSet=new Set();
  (c.goals||[]).forEach(g=>{
    (g.allies||[]).forEach(id=>allySet.add(id));
    (g.blockers||[]).forEach(id=>blockerSet.add(id));
  });

  if(relPairs.length){
    html+=`<div class="chart-grid">`;
    relPairs.forEach(pk=>{
      const[a,b]=pk.split('|');
      const other=a===evoChar?b:a;
      const otherName=allChars.find(x=>x.id===other)?.display_name||other;
      const otherCol=COLORS[other]||'#888';
      const relHist=historyData.relationships[pk]||{};
      const curRel=allRels[pk]||{};
      const hasRelHist=Object.values(relHist).some(arr=>arr.length>0);
      let tags='';
      if(allySet.has(other)) tags+=`<span class="rel-context-tag rel-ally">협력자</span>`;
      if(blockerSet.has(other)) tags+=`<span class="rel-context-tag rel-blocker">방해자</span>`;
      html+=`<div class="chart-card"><div class="chart-label"><span style="color:${otherCol}">${otherName}${tags}</span><span class="val" style="font-size:.65em;color:var(--dim)">대화 ${curRel.interaction_count||0}회</span></div>`;
      if(hasRelHist){
        html+=`<canvas class="chart-canvas" id="chart-rel-${pk.replace('|','_')}" style="height:90px"></canvas>`;
        html+=`<div class="evo-legend">${Object.keys(REL_KR).map(k=>{
          const trend=analyzeTrend(relHist[k]||[]);
          return `<span class="evo-legend-item"><span class="evo-legend-dot" style="background:${REL_COLORS[k]}"></span>${REL_KR[k]} ${((curRel[k]||0)*100).toFixed(0)}%</span>`;
        }).join('')}</div>`;
      } else {
        html+=`<div style="display:flex;gap:4px;margin-top:6px">`;
        ['warmth','trust','tension','affection'].forEach(k=>{
          const v=(curRel[k]||0)*100;
          html+=`<div style="flex:1" title="${REL_KR[k]} ${v.toFixed(0)}%"><div style="height:4px;background:#1a1d28;border-radius:2px;overflow:hidden"><div style="width:${v}%;height:100%;background:${REL_COLORS[k]}"></div></div></div>`;
        });
        html+=`</div>`;
      }
      html+=`</div>`;
    });
    html+=`</div>`;
  } else { html+=`<div class="evo-no-data">관계 데이터 없음</div>`; }
  html+=`</div>`;

  el.innerHTML=html;

  // Draw canvases after DOM update
  requestAnimationFrame(()=>{
    // Combined needs chart
    if(hasNeeds){
      const nc=document.getElementById('chart-needs-all');
      if(nc) drawLineChart(nc,NEEDS.map(k=>({values:charNeeds[k]||[],color:NEED_COLORS[k]})));
      // Individual need charts
      NEEDS.forEach(k=>{
        const cv=document.getElementById('chart-need-'+k);
        if(cv) drawLineChart(cv,[{values:charNeeds[k]||[],color:NEED_COLORS[k]}]);
      });
    }
    // Combined beliefs chart
    if(hasBeliefs){
      const bc=document.getElementById('chart-beliefs-all');
      if(bc) drawLineChart(bc,Object.keys(BELIEF_KR).map(k=>({values:charBeliefs[k]||[],color:BELIEF_COLORS[k]})));
      Object.keys(BELIEF_KR).forEach(k=>{
        const cv=document.getElementById('chart-belief-'+k);
        if(cv) drawLineChart(cv,[{values:charBeliefs[k]||[],color:BELIEF_COLORS[k]}]);
      });
    }
    // Relationship charts
    relPairs.forEach(pk=>{
      const relHist=historyData.relationships[pk]||{};
      const hasRH=Object.values(relHist).some(arr=>arr.length>0);
      if(hasRH){
        const cv=document.getElementById('chart-rel-'+pk.replace('|','_'));
        if(cv) drawLineChart(cv,Object.keys(REL_KR).map(k=>({values:relHist[k]||[],color:REL_COLORS[k]})));
      }
    });
  });
}

async function loadAvatar(){
  try{
    const [allData,convData]=await Promise.all([
      fetch('/api/all').then(r=>r.json()),
      fetch('/api/conversations').then(r=>r.json())
    ]);
    allChars=allData.characters;
    allRels=allData.relationships;
    avatarState=allData.state;
    avatarConvs=convData;
    renderAvatarSidebar();
    if(avatarChar) loadAvatarMems(avatarChar);
  }catch(e){console.error(e)}
}

async function loadAvatarMems(charId){
  try{
    avatarMems=await fetch('/api/memories?id='+charId).then(r=>r.json());
  }catch{avatarMems=[];}
  renderAvatarView();
}

function renderAvatarSidebar(){
  const el=document.getElementById('av-charlist');
  el.innerHTML=allChars.map(c=>{
    const col=COLORS[c.id]||'#888';
    const act=avatarChar===c.id?'active':'';
    return `<div class="evo-char ${act}" onclick="selectAvatarChar('${c.id}')"><div class="dot" style="background:${col}"></div><span style="color:${col}">${c.display_name}</span></div>`;
  }).join('');
}

function selectAvatarChar(id){
  avatarChar=avatarChar===id?null:id;
  renderAvatarSidebar();
  if(avatarChar) loadAvatarMems(avatarChar);
  else document.getElementById('av-main').innerHTML='<div class="av-no-data">주민을 선택하면 그 사람의 시점으로 세상을 봅니다</div>';
}
window.selectAvatarChar=selectAvatarChar;

function renderAvatarView(){
  if(!avatarChar)return;
  const el=document.getElementById('av-main');
  const c=allChars.find(x=>x.id===avatarChar);
  if(!c){el.innerHTML='';return;}
  const col=COLORS[avatarChar]||'#888';
  const loc=c.location||'residential';
  const locInfo=LOC_INFO[loc]||{name:loc,desc:'',vibe:''};
  const curHour=avatarState?.hour||0;

  // who's at same location
  const colocated=allChars.filter(x=>x.id!==avatarChar&&x.location===loc);

  // get relationship for a character
  function getRel(otherId){
    const k1=avatarChar+'|'+otherId;
    const k2=otherId+'|'+avatarChar;
    return allRels[k1]||allRels[k2]||{};
  }

  let html='';

  // === PROFILE ===
  const initial=c.display_name.charAt(0);
  const energyPct=Math.round((c.energy||0)/(3.5)*100);
  const energyCol=energyPct>60?'var(--green)':energyPct>30?'var(--amber)':'var(--red)';
  html+=`<div class="av-profile">
    <div class="av-avatar" style="background:${col}">${initial}</div>
    <div class="av-info">
      <div class="av-name" style="color:${col}">${c.display_name}</div>
      <div class="av-role">${c.role||''} ${c.age?'· '+c.age:''} ${c.is_ai?'· AI':''}</div>
      <div class="av-badges">
        <span class="av-badge av-badge-emotion">${c.emotional_state||'평온'}</span>
        <span class="av-badge av-badge-energy">에너지 ${energyPct}%<span class="av-energy-bar"><span class="av-energy-fill" style="width:${energyPct}%;background:${energyCol}"></span></span></span>
      </div>
    </div>
  </div>`;

  // === LOCATION SCENE ===
  html+=`<div class="av-scene">
    <div class="av-scene-top"><span class="av-scene-name">${locInfo.name}</span><span class="av-scene-vibe">${locInfo.vibe}</span></div>
    <div class="av-scene-desc">${locInfo.desc}</div>`;
  if(colocated.length){
    html+=`<div class="av-scene-people">`;
    colocated.forEach(p=>{
      const pc=COLORS[p.id]||'#888';
      const rel=getRel(p.id);
      const warmth=Math.round((rel.warmth||0)*100);
      const relHint=warmth>70?'친밀':warmth>40?'보통':'소원';
      html+=`<div class="av-person"><div class="dot" style="background:${pc}"></div><span style="color:${pc}">${p.display_name}</span><span class="av-person-rel">(${relHint})</span></div>`;
    });
    html+=`</div>`;
  } else {
    html+=`<div style="font-size:.78em;color:var(--dim);font-style:italic">혼자 있다</div>`;
  }
  html+=`</div>`;

  // === GRID: Inner State + Persona ===
  html+=`<div class="av-grid">`;

  // Inner state
  html+=`<div class="av-card"><div class="av-card-title">내면 상태</div>`;
  const needColors={belonging:'#3b82f6',purpose:'#a78bfa',security:'#10b981',recognition:'#f59e0b',autonomy:'#ec4899',affection:'#f472b6'};
  NEEDS.forEach(k=>{
    const v=c.needs?.[k]||0;
    const pct=Math.round(v*100);
    const barCol=v>0.5?needColors[k]:(v>0.2?'var(--amber)':'var(--red)');
    html+=`<div class="av-need-row"><span class="av-need-label">${NEED_KR[k]}</span><div class="av-need-bar"><div class="av-need-fill" style="width:${pct}%;background:${barCol}"></div></div><span class="av-need-val" style="color:${barCol}">${pct}%</span></div>`;
  });
  // beliefs compact
  if(c.beliefs){
    const BKR={ai_consciousness:'AI의식',ai_rights:'AI권리',human_uniqueness:'인간고유',progress_good:'진보긍정',community_priority:'공동체'};
    html+=`<div style="margin-top:10px;padding-top:8px;border-top:1px solid #1e2235"><div class="av-card-title" style="margin-bottom:6px">신념</div>`;
    Object.entries(c.beliefs).forEach(([k,v])=>{
      const pct=Math.round(v*100);
      html+=`<div class="av-need-row"><span class="av-need-label" style="width:48px">${BKR[k]||k}</span><div class="av-need-bar"><div class="av-need-fill" style="width:${pct}%;background:var(--accent)"></div></div><span class="av-need-val" style="color:var(--accent)">${pct}%</span></div>`;
    });
    html+=`</div>`;
  }
  html+=`</div>`;

  // Persona + Secret + Goals
  html+=`<div class="av-card"><div class="av-card-title">인격</div>`;
  html+=`<div class="av-persona-text">${c.persona||''}</div>`;
  if(c.persona_addendum) html+=`<div class="av-persona-text" style="margin-top:6px;color:var(--accent);font-style:italic">"${c.persona_addendum}"</div>`;
  if(c.stance_on_ai) html+=`<div class="av-stance"><b>AI관:</b> ${c.stance_on_ai}</div>`;
  if(c.secret) html+=`<div class="av-secret"><b>내면:</b> ${c.secret}</div>`;
  // goals inside persona card
  if(c.goals&&c.goals.length){
    html+=`<div style="margin-top:10px;padding-top:8px;border-top:1px solid #1e2235"><div class="av-card-title" style="margin-bottom:6px">목표</div>`;
    c.goals.forEach(g=>{
      const pct=Math.round((g.progress||0)*100);
      const allies=(g.allies||[]).map(id=>allChars.find(x=>x.id===id)?.display_name||id);
      const blockers=(g.blockers||[]).map(id=>allChars.find(x=>x.id===id)?.display_name||id);
      html+=`<div class="av-goal-item"><div class="av-goal-desc">${g.description} <span style="color:var(--accent);font-weight:600">${pct}%</span></div><div class="av-goal-bar"><div class="av-goal-fill" style="width:${pct}%"></div></div><div class="av-goal-meta">${allies.length?`<span class="av-goal-allies">협력: ${allies.join(', ')}</span>`:''}${blockers.length?`<span class="av-goal-blockers">방해: ${blockers.join(', ')}</span>`:''}</div></div>`;
    });
    html+=`</div>`;
  }
  html+=`</div>`;
  html+=`</div>`; // close grid

  // === CONVERSATIONS (chat style) ===
  const myConvs=avatarConvs.filter(cv=>(cv.participants||[]).includes(avatarChar)).slice(0,20);
  html+=`<div class="av-convs"><div class="av-card-title">최근 대화 (${myConvs.length}건)</div>`;
  if(myConvs.length){
    myConvs.forEach(cv=>{

      (cv.exchanges||[]).forEach(e=>{
        const isSelf=e.speaker===avatarChar;
        const msgCol=COLORS[e.speaker]||'#888';
        html+=`<div class="av-msg ${isSelf?'self':'other'}"><div class="av-msg-bubble"><div class="av-msg-nm" style="color:${msgCol}">${e.name}</div>${e.text}</div></div>`;
      });
      html+=`</div>`;
    });
  } else {
    html+=`<div class="av-no-data">아직 대화 기록이 없습니다</div>`;
  }
  html+=`</div>`;

  // === GRID: Relationships + Memories/Schedule ===
  html+=`<div class="av-grid">`;

  // Relationships
  html+=`<div class="av-card"><div class="av-card-title">관계</div>`;
  html+=`<div class="av-rel-legend"><span><span class="dot" style="background:var(--blue)"></span>온기</span><span><span class="dot" style="background:var(--green)"></span>신뢰</span><span><span class="dot" style="background:var(--red)"></span>긴장</span><span><span class="dot" style="background:var(--pink)"></span>애정</span></div>`;
  const relEntries=[];
  allChars.forEach(oc=>{
    if(oc.id===avatarChar)return;
    const rel=getRel(oc.id);
    if(!rel.warmth&&!rel.trust&&!rel.tension&&!rel.affection)return;
    relEntries.push({id:oc.id,name:oc.display_name,rel,present:oc.location===loc});
  });
  relEntries.sort((a,b)=>(b.present?1:0)-(a.present?1:0)||(b.rel.warmth||0)-(a.rel.warmth||0));
  relEntries.forEach(({id,name,rel,present})=>{
    const oc=COLORS[id]||'#888';
    html+=`<div class="av-rel-item"><span class="av-rel-name" style="color:${oc}">${present?'●':''}${name}</span><div class="av-rel-bars">
      <div class="av-rel-bar-wrap"><div class="av-rel-bar-fill" style="width:${(rel.warmth||0)*100}%;background:var(--blue)"></div></div>
      <div class="av-rel-bar-wrap"><div class="av-rel-bar-fill" style="width:${(rel.trust||0)*100}%;background:var(--green)"></div></div>
      <div class="av-rel-bar-wrap"><div class="av-rel-bar-fill" style="width:${(rel.tension||0)*100}%;background:var(--red)"></div></div>
      <div class="av-rel-bar-wrap"><div class="av-rel-bar-fill" style="width:${(rel.affection||0)*100}%;background:var(--pink)"></div></div>
    </div><span class="av-rel-cnt">${rel.interaction_count||0}회</span></div>`;
  });
  if(!relEntries.length) html+=`<div class="av-no-data">관계 데이터 없음</div>`;
  html+=`</div>`;

  // Memories + Schedule
  html+=`<div>`;
  // Schedule
  const sched=CHAR_SCHEDULES[avatarChar]||{};
  html+=`<div class="av-card" style="margin-bottom:16px"><div class="av-card-title">오늘의 일과</div>`;
  SCHED_PERIODS.forEach(p=>{
    const isNow=p.hours.includes(curHour);
    const schedLoc=sched[p.key]||'residential';
    const schedName=LOC_INFO[schedLoc]?.name||schedLoc;
    html+=`<div class="av-sched-row"><span class="av-sched-time">${p.label}</span><span class="av-sched-dot ${isNow?'now':''}"></span><span class="av-sched-loc ${isNow?'av-sched-now':''}">${schedName}</span></div>`;
  });
  html+=`</div>`;

  // Memories
  html+=`<div class="av-card"><div class="av-card-title">기억 (최근)</div>`;
  if(avatarMems.length){
    avatarMems.slice(0,8).forEach(m=>{
      if(!m.day&&!m.summary) return;
      const otherName=allChars.find(x=>x.id===m.other)?.display_name||m.other_name||m.other||'';
      const mLoc=LOC_KR[m.location]||m.location||'';
      const dayLabel=m.day!=null?`Day${m.day} ${String(m.hour||0).padStart(2,'0')}h`:'';
      const summary=(m.summary||'').split('\n')[0].slice(0,120);
      html+=`<div class="av-mem-item">${dayLabel?`<span class="av-mem-day">${dayLabel}</span>`:''} <span class="av-mem-other" style="color:${COLORS[m.other]||'var(--dim)'}">${otherName}</span>${mLoc?' @ '+mLoc:''}<br>${summary}</div>`;
    });
  } else {
    html+=`<div class="av-no-data">기억 없음</div>`;
  }
  html+=`</div>`;
  html+=`</div>`; // close right column
  html+=`</div>`; // close grid

  el.innerHTML=html;
}
</script>
</body>
</html>
